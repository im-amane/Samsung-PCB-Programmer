name: samsung_pcb_programmer
description: Independent Android USB firmware utility for Samsung refrigerator inverter PCB research.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  archive: ^3.6.1
  flutter:
    sdk: flutter
  usb_serial:
    git:
      url: https://github.com/altera2015/usbserial.git
      ref: master
  file_picker: ^10.3.10
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
