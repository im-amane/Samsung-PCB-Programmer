name: samsung_pcb_programmer
description: Independent Android USB firmware utility for Samsung refrigerator inverter PCB research.
publish_to: "none"
version: 0.2.0+2

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  usb_serial: ^0.5.2
  file_picker: ^8.1.7
  crypto: ^3.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
