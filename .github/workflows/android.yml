name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project scaffolding
        run: flutter create . --platforms=android --project-name samsung_pcb_programmer
      - name: Resolve dependencies
        run: flutter pub get
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samsung-pcb-programmer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
