name: Android APK

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test APK asset extractor
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Validate bundled firmware assets
        run: python3 tools/validate_firmware.py assets/firmwares/DA41-00814A.mot assets/firmwares/DA41-00814D_0459G.mot assets/firmwares/DA41-00814D_0459M.bin
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project scaffolding
        run: flutter create . --platforms=android --project-name samsung_pcb_programmer
      - name: Resolve dependencies
        run: flutter pub get
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("android"), Path.home() / ".pub-cache"]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  content = path.read_text()
                  content = re.sub(r"compileSdkVersion\s+\d+", "compileSdkVersion 36", content)
                  content = re.sub(r"compileSdk\s*=\s*\d+", "compileSdk = 36", content)
                  content = content.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
                  content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
                  path.write_text(content)
          PY
      - name: Patch legacy Android plugin repositories
        run: |
          for PLUGIN in \
            "$HOME/.pub-cache/hosted/pub.dev/flutter_libserialport-0.6.0/android/build.gradle"; do
            if [ -f "$PLUGIN" ]; then
              sed -i 's/jcenter()/mavenCentral()/g' "$PLUGIN"
            fi
          done
      - name: Run unit tests
        run: flutter test
      - name: Analyze Flutter source
        run: flutter analyze --no-pub
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samsung-pcb-programmer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
