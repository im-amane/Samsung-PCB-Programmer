name: Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Create Android project scaffolding
        run: flutter create . --platforms=android --project-name samsung_pcb_programmer
      - name: Resolve dependencies
        run: flutter pub get
      - name: Set Android compile SDK to 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          roots = [Path("android"), Path.home() / ".pub-cache"]
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob("build.gradle*"):
                  text = path.read_text()
                  text = re.sub(r"compileSdkVersion\\s+\\d+", "compileSdkVersion 36", text)
                  text = re.sub(r"compileSdk\\s*=\\s*\\d+", "compileSdk = 36", text)
                  text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
                  text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
                  path.write_text(text)
          PY
      - name: Patch legacy USB serial repository declaration
        run: |
          PLUGIN="$HOME/.pub-cache/hosted/pub.dev/usb_serial-0.5.2/android/build.gradle"
          if [ -f "$PLUGIN" ]; then
            sed -i 's/jcenter()/mavenCentral()/g' "$PLUGIN"
          fi
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: samsung-pcb-programmer-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
